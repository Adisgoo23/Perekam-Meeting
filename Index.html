<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Perekam Meeting Direct</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    input, textarea, button { width: 100%; margin-top: 10px; padding: 10px; box-sizing: border-box; }
    button { font-weight: bold; cursor: pointer; }
    .btn-start { background: #1a73e8; color: white; border: none; }
    .btn-stop { background: #ea4335; color: white; border: none; display: none; }
    .btn-save { background: #34a853; color: white; border: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>??? Perekam Meeting</h2>
    <input type="text" id="scriptUrl" placeholder="Tempel Web App URL Google Script di sini">
    <input type="text" id="judul" placeholder="Judul Meeting">
    <input type="text" id="peserta" placeholder="Daftar Peserta">
    
    <button id="btnStart" class="btn-start" onclick="startRec()">Mulai Merekam</button>
    <button id="btnStop" class="btn-stop" onclick="stopRec()">Hentikan Merekam</button>
    
    <p id="status">Status: Siap</p>
    <textarea id="transkrip" rows="8" placeholder="Hasil transkrip..."></textarea>
    
    <button class="btn-save" onclick="kirimData()">Simpan & Kirim Email</button>
  </div>

  <script>
    let recognition;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'id-ID';

      recognition.onresult = (e) => {
        let text = '';
        for (let i = 0; i < e.results.length; i++) {
          text += e.results[i][0].transcript + ' ';
        }
        document.getElementById('transkrip').value = text;
      };
    } else {
      alert("Browser tidak mendukung Web Speech API. Gunakan Chrome.");
    }

    function startRec() {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(() => {
        isRecording = true;
        recognition.start();
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnStop').style.display = 'block';
        document.getElementById('status').innerText = '?? Merekam...';
      }).catch(err => alert("Gagal akses mikrofon: " + err.message));
    }

    function stopRec() {
      isRecording = false;
      recognition.stop();
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnStop').style.display = 'none';
      document.getElementById('status').innerText = '?? Dihentikan';
    }

    function kirimData() {
      const url = document.getElementById('scriptUrl').value;
      if(!url) return alert("Masukkan Web App URL Google Script!");

      const payload = {
        judul: document.getElementById('judul').value,
        peserta: document.getElementById('peserta').value,
        transkrip: document.getElementById('transkrip').value
      };

      fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        alert("Data berhasil dikirim ke Google Sheet!");
      }).catch(err => alert("Gagal mengirim: " + err));
    }
  </script>
</body>
</html>
